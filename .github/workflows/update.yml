name: Update Twin Waters Info flood data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch BOM bulletins and build data.json
        run: python update_data.py

      # Independent of the gauge step: runs (and commits) even if BOM failed.
      - name: Fetch QLDTraffic events and cameras (closures, roadworks, hazards, crashes, cameras)
        if: ${{ !cancelled() }}
        run: python update_roads.py

      # Mooloolaba tide predictions (tides.json); a failure keeps the old file.
      - name: Fetch BOM tide predictions (tides.json)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python update_tides.py

      # BOM 10-minute observations: wind at stations in the circle (wind.json).
      - name: Fetch BOM wind observations (wind.json)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python update_wind.py

      # BOM rainfall: since 9am + last 7 rain days (rain.json); a failure keeps the old file (marked stale).
      - name: Fetch BOM rainfall totals (rain.json)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python update_rain.py

      - name: Commit data files if they changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json stations.json flood_levels.json closures.json cameras.json roadworks.json hazards.json crashes.json tides.json wind.json rain.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update river gauge, road, tide, wind and rain data $(TZ=Australia/Brisbane date '+%Y-%m-%d %H:%M AEST')"
            git pull --rebase || { git rebase --abort; exit 1; }
            git push
          fi
